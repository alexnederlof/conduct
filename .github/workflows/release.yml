name: Build and release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-latest
            platform: darwin-arm64
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Set up Node for launcher tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build:binary
      - name: Test executable without Node or Bun on PATH
        run: bun scripts/test-binary.ts dist/conduct-${{ matrix.platform }}
      - name: Upload executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conduct-${{ matrix.platform }}
          path: dist/conduct-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
      - name: Download verified executables
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Package sources and licenses
        run: |
          bun pm pack --filename dist/conduct.tgz
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          cp docs/licenses/BUN-LICENSE.md dist/
          cd dist
          sha256sum conduct-* conduct.tgz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bun -p "require('./package.json').version")
          mkdir -p .temp
          cat > .temp/release-notes.md <<'NOTES'
          Download the executable for your platform, rename it to `conduct`, and run `chmod +x conduct`. It includes Bun, the presenter, fonts, and production dependencies. Node.js and Bun are not required.

          With Node.js 20+ and npm, you can also run the packaged source directly:

          ```sh
          npx --yes --package https://github.com/alexnederlof/conduct/releases/latest/download/conduct.tgz conduct ./proposal.md
          ```

          See the README and docs/distribution.md for installation, agent skills, plan hooks, and verification with SHA256SUMS. Conduct is MIT licensed; dependency notices are included.
          NOTES
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --title "Conduct $version" --notes-file .temp/release-notes.md --latest
